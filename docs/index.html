<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Music Persona — 나의 음악 취향</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><a class="brand" href="./"><span class="logo">m.</span> MUSIC PERSONA</a><button id="export" hidden>카드 저장</button></header>
<main>
<section id="test-intro" class="intro"><div><h1>나의 <em>음악 취향</em>은?</h1><p class="sub">좋아하는 곡을 5개 이상 골라주세요.</p><small class="demo-label">가상곡으로 체험하는 데모 · 미리듣기 없음</small></div></section>
<section id="test-view" aria-label="음악 선택">
<form id="test-form"><aside class="panel library"><div class="section-head"><h2 id="test-heading" tabindex="-1">음악 선택</h2><span id="count" aria-live="polite"></span></div><input id="search" aria-label="곡 검색" placeholder="가수 또는 노래 제목"><div id="songs"></div><button type="button" id="clear" class="text-btn">선택 지우기</button></aside><div class="submit-bar"><div><strong id="selection-status" aria-live="polite"></strong><p id="form-error" role="alert" hidden></p></div><button type="submit" class="primary" id="submit-test">결과 보기</button></div></form>
</section>
<section id="result-view" hidden aria-label="나의 음악 취향 결과">
<article class="persona result-persona"><h1 id="persona-title" tabindex="-1"></h1><p id="persona-desc"></p><div id="summary"></div></article>
<section class="panel map-panel"><div class="section-head"><h2>취향 지도</h2><div class="tabs"><button data-mode="PCA" class="active">특징 한눈에</button><button data-mode="UMAP">비슷한 곡끼리</button></div></div><div class="map-tools"><span>● 내 음악 <span class="faint">● 전체 음악</span></span><label class="color-label"><span class="sr-only">지도 색상</span><select id="color" aria-label="지도 색상"><option value="group">음악 느낌</option><option value="energy">활기</option><option value="valence">밝은 분위기</option></select></label></div><div class="plot-wrap"><svg id="plot" viewBox="0 0 760 490" role="group" aria-label="음악 취향 지도"></svg><div id="tooltip" hidden></div><div id="loading" hidden>비슷한 곡을 모으는 중…</div></div><p id="explain" class="map-note"></p><div class="legend"><span style="--c:#c3f16b">어쿠스틱</span><span style="--c:#b8a1ff">전자 음악</span><span style="--c:#f49d78">록</span><span style="--c:#75d5d1">소울·재즈</span></div></section>
<article class="panel details"><h2 class="behind-heading">Behind the sound</h2><div class="sound-detail"><div><h3 id="detail-title"></h3><p id="detail-artist" class="muted"></p><p id="neighbors" class="muted"></p></div><div id="features"></div></div></article>
<div class="result-bottom"><span class="demo-label">가상곡 기반 체험 결과</span><div class="result-actions"><button id="edit-test">곡 바꾸기</button><button id="restart-test">다시 하기</button></div></div>
</section>
</main><script src="app.js"></script>
</body></html>
